<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>备忘任务管理</title>
  <style>
    :root{color-scheme:light dark;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;--bg:#f4f6f8;--panel:#fff;--text:#20262e;--muted:#687482;--line:#dce2e8;--accent:#147d70;--danger:#b93838}
    :root.dark{--bg:#171b20;--panel:#20262e;--text:#e6ebf0;--muted:#a2adb9;--line:#39434e;--accent:#63cbbb;--danger:#ff7777}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1200px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{font-size:20px;margin:0;font-weight:650}.sub{color:var(--muted);font-size:12px;margin-top:3px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}input,select,textarea,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:white;border-color:var(--accent)}.count{color:var(--muted);margin-left:auto;white-space:nowrap}.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:550;font-size:12px}tbody tr:last-child td{border-bottom:0}.task{white-space:pre-wrap;overflow-wrap:anywhere;max-width:420px}.minor{display:block;color:var(--muted);font-size:12px;margin-top:3px}.status{white-space:nowrap}.danger{color:var(--danger)}.row-actions{display:flex;gap:5px}.row-actions button{padding:5px 8px}.empty,.error{padding:28px;text-align:center;color:var(--muted)}.error{color:var(--danger)}dialog{width:min(520px,calc(100vw - 24px));max-height:90vh;overflow:auto;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0}dialog::backdrop{background:#0009}.form-head,.form-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.form-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.form-body{padding:16px 18px;display:grid;gap:12px}.field{display:grid;gap:5px}.field input,.field select,.field textarea{width:100%;min-width:0}.field textarea{min-height:78px;resize:vertical}.inline{display:flex;align-items:center;gap:8px}.inline input{flex:0 0 auto;min-width:0}.hint{font-size:12px;color:var(--muted)}@media(max-width:600px){main{padding:14px}header{align-items:flex-start}.tools{align-items:stretch}select{flex:1}.count{width:100%;margin:0}}
    html,body{height:100%;overflow:hidden}main{height:100%;display:flex;flex-direction:column}
    header,.tools{flex-shrink:0}.table-wrap{flex:1;min-height:0}
    .table-wrap:has(.empty) table{min-width:100%}
    dialog{max-height:min(90dvh,var(--maibot-viewport-height,90dvh));overflow:hidden}
    dialog[open],dialog form{display:flex;flex-direction:column;min-height:0}
    .form-head,.form-foot{flex-shrink:0}.form-body{overflow-y:auto;min-height:0}
    .notice{margin:0 0 12px;padding:10px;text-align:left;border:1px solid var(--danger);border-radius:5px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <header><div><h1>备忘任务</h1><div class="sub">查看、筛选和管理定时提醒</div></div><div class="row-actions"><button id="refresh" type="button" aria-label="刷新任务" title="刷新任务">↻</button><button id="add" class="primary" type="button">新增任务</button></div></header>
  <section class="tools" aria-label="筛选任务">
    <input id="search" type="search" placeholder="搜索任务内容或用户 ID" aria-label="搜索任务内容或用户 ID">
    <select id="status" aria-label="任务状态"><option value="pending">待提醒</option><option value="all">全部状态</option><option value="done">已完成</option><option value="rejected">已取消</option><option value="failed">失败</option></select>
    <select id="repeat" aria-label="重复方式"><option value="all">全部类型</option><option value="once">单次</option><option value="daily">每日重复</option></select>
    <span class="count" id="count">读取中…</span>
  </section>
  <div id="page-error" class="error notice" role="alert" hidden></div>
  <div class="table-wrap"><table><thead><tr><th>提醒内容</th><th>用户</th><th>提醒时间</th><th>重复</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">正在读取任务…</td></tr></tbody></table></div>
</main>
<dialog id="editor" aria-labelledby="form-title">
  <form id="task-form">
    <div class="form-head"><strong id="form-title">新增备忘任务</strong><button id="close" type="button" aria-label="关闭">×</button></div>
    <div class="form-body">
      <label class="field">提醒内容<textarea id="task-text" maxlength="500" required></textarea></label>
      <label class="field">平台标识<input id="source-platform" value="qq" maxlength="80" required></label>
      <div class="hint">普通 QQ 填 qq；其他连接器填写其实际平台标识，用户与群组 ID 也须来自同一平台。</div>
      <label class="field">用户 QQ 号或平台用户 ID<input id="user-id" maxlength="80" required></label>
      <label class="field">群号或平台群组 ID（可留空）<input id="group-id" maxlength="80"></label>
      <label class="field">提醒时间<input id="remind-at" type="datetime-local" required></label>
      <label class="field">提醒渠道<select id="channel"><option value="auto">自动</option><option value="private">私聊</option><option value="group">群聊 @</option></select></label>
      <label class="inline"><input id="repeat-daily" type="checkbox"><span>每日重复</span></label>
      <div class="hint">每日任务每次处理后保留，并按服务器时区的相同时间顺延到次日。提醒时间按浏览器本地时区填写。</div>
      <div id="form-error" class="error notice" role="alert" hidden></div>
    </div>
    <div class="form-foot"><button id="cancel-form" type="button">取消</button><button id="save" class="primary" type="submit">保存</button></div>
  </form>
</dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title">
  <div class="form-head"><strong id="delete-title">删除备忘任务</strong></div>
  <div class="form-body"><p id="delete-description"></p><div id="delete-error" class="error notice" role="alert" hidden></div></div>
  <div class="form-foot"><button id="keep-task" type="button">保留任务</button><button id="confirm-delete" class="danger" type="button">确认删除</button></div>
</dialog>
<script>
(() => {
  const $=id=>document.getElementById(id),rows=$('rows'),count=$('count'),search=$('search'),status=$('status'),repeat=$('repeat'),editor=$('editor');
  const labels={pending:'待提醒',sending:'发送中',done:'已完成',rejected:'已取消',failed:'失败'};
  const channels={auto:'自动',private:'私聊',group:'群聊 @'};
  let editingId='',deleteId='',busy=false,generation=0,queue=Promise.resolve(),tasks=new Map();
  // Host SDK limits concurrent requests. Serialize the bridge calls and discard stale lists.
  function request(kind,name,args){const result=queue.then(async()=>{await maibot.ready;return maibot[kind](name,args);});queue=result.catch(()=>{});return result;}
  function errorAt(id,error){$(id).textContent=error?.message||String(error||'');$(id).hidden=!error;}
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date=ts=>ts?new Date(ts*1000).toLocaleString():'-';
  const localInput=ts=>{const d=new Date(ts*1000);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);};
  async function load(){
    const current=++generation;errorAt('page-error',null);
    rows.innerHTML='<tr><td colspan="6" class="empty">正在读取任务…</td></tr>';
    try{
      const result=await request('query','list',{query:search.value,status:status.value,repeat:repeat.value});
      if(current!==generation)return;
      tasks=new Map((result.tasks||[]).map(task=>[task.id,task]));
      count.textContent=`${result.total||0} 条${result.truncated?'（仅显示前 500 条）':''}`;
      if(!tasks.size){rows.innerHTML='<tr><td colspan="6" class="empty">没有符合条件的任务</td></tr>';return;}
      rows.innerHTML=[...tasks.values()].map(t=>`<tr><td class="task">${esc(t.task)}<span class="minor">创建于 ${esc(date(t.created_at))}${t.media_count?` · ${t.media_count} 个附件`:''}</span></td><td>${esc(t.user_id)}<span class="minor">${esc(t.source_platform||'qq')}${t.group_id?` · 群 ${esc(t.group_id)}`:''}</span></td><td>${esc(date(t.remind_at))}<span class="minor">${esc(channels[t.channel]||t.channel)}</span></td><td>${t.repeat_daily?'每日':'单次'}</td><td class="status">${esc(labels[t.status]||t.status)}${t.last_status==='failed'?'<span class="minor">上次发送失败</span>':''}</td><td><div class="row-actions">${t.status==='pending'?`<button type="button" data-edit="${esc(t.id)}">编辑</button>`:''}${t.status!=='sending'?`<button type="button" class="danger" data-delete="${esc(t.id)}">删除</button>`:''}</div></td></tr>`).join('');
    }catch(e){if(current!==generation)return;count.textContent='读取失败';rows.innerHTML='<tr><td colspan="6" class="empty">未能读取任务，请刷新重试</td></tr>';errorAt('page-error',e);}
  }
  function openForm(task){
    if(busy)return;editingId=task?.id||'';errorAt('form-error',null);
    $('form-title').textContent=editingId?'编辑备忘任务':'新增备忘任务';
    $('task-text').value=task?.task||'';$('user-id').value=task?.user_id||'';
    $('group-id').value=task?.group_id||'';$('source-platform').value=task?.source_platform||'qq';
    $('remind-at').value=task?localInput(task.remind_at):localInput(Date.now()/1000+3600);
    $('channel').value=task?.channel||'auto';$('repeat-daily').checked=!!task?.repeat_daily;editor.showModal();
  }
  function setBusy(value){busy=value;for(const id of ['save','close','cancel-form','keep-task','confirm-delete'])$(id).disabled=value;}
  $('add').addEventListener('click',()=>openForm(null));
  $('close').addEventListener('click',()=>editor.close());$('cancel-form').addEventListener('click',()=>editor.close());
  $('refresh').addEventListener('click',load);
  for(const dialog of [editor,$('delete-dialog')]){
    dialog.addEventListener('cancel',e=>{if(busy)e.preventDefault();});
    dialog.addEventListener('click',e=>{if(e.target!==dialog||busy)return;const box=dialog.getBoundingClientRect();if(e.clientX<box.left||e.clientX>box.right||e.clientY<box.top||e.clientY>box.bottom)dialog.close();});
  }
  $('task-form').addEventListener('submit',async e=>{
    e.preventDefault();if(busy)return;setBusy(true);errorAt('form-error',null);
    const payload={task_text:$('task-text').value,user_id:$('user-id').value,group_id:$('group-id').value,source_platform:$('source-platform').value,remind_at:Math.floor(new Date($('remind-at').value).getTime()/1000),channel_pref:$('channel').value,repeat_daily:$('repeat-daily').checked};
    try{await request('action',editingId?'update':'create',{...(editingId?{task_id:editingId}:{}),payload:JSON.stringify(payload)});editor.close();await load();}
    catch(error){errorAt('form-error',error);}finally{setBusy(false);}
  });
  rows.addEventListener('click',e=>{
    if(busy)return;const edit=e.target.closest('[data-edit]');
    if(edit){const task=tasks.get(edit.dataset.edit);if(task)openForm(task);return;}
    const del=e.target.closest('[data-delete]');
    if(del){deleteId=del.dataset.delete;errorAt('delete-error',null);$('delete-description').textContent=`永久删除“${tasks.get(deleteId)?.task||'这条任务'}”及其附件？`;$('delete-dialog').showModal();}
  });
  $('keep-task').addEventListener('click',()=>$('delete-dialog').close());
  $('confirm-delete').addEventListener('click',async()=>{
    if(busy)return;setBusy(true);errorAt('delete-error',null);
    try{await request('action','delete',{task_id:deleteId});$('delete-dialog').close();await load();}
    catch(error){errorAt('delete-error',error);}finally{setBusy(false);}
  });
  status.addEventListener('change',load);repeat.addEventListener('change',load);let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250);});load();
})();
</script>
</body>
</html>
