<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>备忘任务管理</title>
  <style>
    :root{color-scheme:light dark;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;--bg:#f4f6f8;--panel:#fff;--text:#20262e;--muted:#687482;--line:#dce2e8;--accent:#147d70;--danger:#b93838}
    @media(prefers-color-scheme:dark){:root{--bg:#171b20;--panel:#20262e;--text:#e6ebf0;--muted:#a2adb9;--line:#39434e;--accent:#63cbbb;--danger:#ff7777}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1200px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}h1{font-size:20px;margin:0;font-weight:650}.sub{color:var(--muted);font-size:12px;margin-top:3px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:white;border-color:var(--accent)}.count{color:var(--muted);margin-left:auto;white-space:nowrap}.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:550;font-size:12px}tbody tr:last-child td{border-bottom:0}.task{white-space:pre-wrap;overflow-wrap:anywhere;max-width:460px}.minor{display:block;color:var(--muted);font-size:12px;margin-top:3px}.status{white-space:nowrap}.cancel{color:var(--danger)}.empty,.error{padding:28px;text-align:center;color:var(--muted)}.error{color:var(--danger)}@media(max-width:600px){main{padding:14px}header{align-items:flex-start}.tools{align-items:stretch}select{flex:1}.count{width:100%;margin:0}}
  </style>
</head>
<body>
<main>
  <header><div><h1>备忘任务</h1><div class="sub">浏览和管理插件中保存的定时提醒</div></div><button id="refresh" type="button" aria-label="刷新任务" title="刷新任务">↻</button></header>
  <section class="tools" aria-label="筛选任务">
    <input id="search" type="search" placeholder="搜索任务内容或 QQ 号" aria-label="搜索任务内容或 QQ 号">
    <select id="status" aria-label="任务状态"><option value="pending">待提醒</option><option value="all">全部状态</option><option value="done">已完成</option><option value="rejected">已取消</option><option value="failed">失败</option></select>
    <span class="count" id="count">读取中…</span>
  </section>
  <div class="table-wrap"><table><thead><tr><th>提醒内容</th><th>用户</th><th>提醒时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">正在读取任务…</td></tr></tbody></table></div>
</main>
<script>
(() => {
  const rows=document.getElementById('rows'),count=document.getElementById('count'),search=document.getElementById('search'),status=document.getElementById('status');
  const labels={pending:'待提醒',sending:'发送中',done:'已完成',rejected:'已取消',failed:'失败'};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date=ts=>ts?new Date(ts*1000).toLocaleString():'-';
  async function load(){
    rows.innerHTML='<tr><td colspan="5" class="empty">正在读取任务…</td></tr>';
    try{await maibot.ready;const result=await maibot.query('list',{query:search.value,status:status.value});const tasks=result.tasks||[];count.textContent=`${result.total||0} 条${result.truncated?'（仅显示前 500 条）':''}`;
      if(!tasks.length){rows.innerHTML='<tr><td colspan="5" class="empty">没有符合条件的任务</td></tr>';return;}
      rows.innerHTML=tasks.map(t=>`<tr><td class="task">${esc(t.task)}<span class="minor">创建于 ${esc(date(t.created_at))}${t.media_count?` · ${t.media_count} 个附件`:''}</span></td><td>${esc(t.user_id)}</td><td>${esc(date(t.remind_at))}<span class="minor">${esc(t.channel||'auto')} 渠道</span></td><td class="status">${esc(labels[t.status]||t.status)}</td><td>${t.status==='pending'?`<button class="cancel" type="button" data-id="${esc(t.id)}">取消</button>`:'-'}</td></tr>`).join('');
    }catch(e){count.textContent='读取失败';rows.innerHTML=`<tr><td colspan="5" class="error">${esc(e.message||'读取任务失败')}</td></tr>`;}
  }
  rows.addEventListener('click',async e=>{const btn=e.target.closest('[data-id]');if(!btn)return;if(!confirm('取消这条备忘任务？'))return;btn.disabled=true;try{await maibot.action('cancel',{task_id:btn.dataset.id});await load();}catch(err){alert(err.message||'取消失败');btn.disabled=false;}});
  document.getElementById('refresh').addEventListener('click',load);status.addEventListener('change',load);let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250);});load();
})();
</script>
</body>
</html>
